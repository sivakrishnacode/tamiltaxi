name: GitHub sync

# Mirrors docs/RELEASES.md (releases and their tags) and docs/ROADMAP.md (milestones and issues) on GitHub, plus the
# planning labels. See docs/GITHUB.md.
on:
  push:
    branches: [main]
    paths: [docs/RELEASES.md, docs/ROADMAP.md, scripts/sync_github.py, .github/workflows/github-sync.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: github-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync releases, milestones and issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/sync_github.py
        env:
          GH_TOKEN: ${{ github.token }}
