name: tamiltaxi_whatsapp_otp
description: WhatsApp OTP autofill for the Tamil Taxi apps (Meta's zero-tap / one-tap authentication templates). Android only.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.tamiltaxi.whatsapp_otp
        pluginClass: WhatsAppOtpPlugin
