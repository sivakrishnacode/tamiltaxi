name: tamiltaxi_ui
description: Tamil Taxi design system — theme tokens and shared widgets for both apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  material_symbols_icons: ^4.2960.0
  intl: ^0.20.2
  tamiltaxi_data:
    path: ../tamiltaxi_data
  flutter_riverpod: ^3.4.3
  google_maps_flutter: ^2.18.1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Poppins + Inter bundled so google_fonts never needs the network (offline-safe).
  assets:
    - assets/google_fonts/
    # Launcher icons as shipped (copies of each app's mipmap-xxxhdpi/ic_launcher.png) for the design gallery.
    - assets/brand/
    # The home footer picture (HomeFooter).
    - assets/illustrations/
    # Vehicle renders (VehicleArt), built from docs/design/vechile/ by scripts/vehicle_icons/build.py.
    - assets/vehicles/
