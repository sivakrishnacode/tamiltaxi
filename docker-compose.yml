# Tamil Taxi backend stack.
#   docker compose up -d                 # postgres + redis + api + admin panel
#   docker compose --profile tools up -d # + Adminer (DB) and Redis Insight
name: tamiltaxi

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamiltaxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamiltaxi}
      POSTGRES_DB: ${POSTGRES_DB:-tamiltaxi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tamiltaxi} -d ${POSTGRES_DB:-tamiltaxi}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tamiltaxi-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tamiltaxi}:${POSTGRES_PASSWORD:-tamiltaxi}@postgres:5432/${POSTGRES_DB:-tamiltaxi}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      # With OTP_DEV_MODE in production (NODE_ENV above) this 6-digit code is the only one that signs in. Required.
      DEV_OTP_CODE: ${DEV_OTP_CODE:-}
      # Store-review numbers (comma-separated): never sent a WhatsApp code, they sign in with OTP_REVIEW_CODE.
      OTP_REVIEW_PHONES: ${OTP_REVIEW_PHONES:-}
      OTP_REVIEW_CODE: ${OTP_REVIEW_CODE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ON_START: ${SEED_ON_START:-true}
      # Server key for Places / Geocoding / Routes (restrict by IP). Empty = local fallback.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      # Public admin origin for live trip links (<SHARE_BASE_URL>/track/<token>).
      SHARE_BASE_URL: ${SHARE_BASE_URL:-http://localhost:3001}
      UPLOAD_DIR: /data/uploads
      # Private bucket for KYC documents / images (credentials from the EC2 instance role). Empty = the uploads volume.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Firebase service account (base64 of the JSON) for push notifications. Empty = push disabled.
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
      # Didit identity checks (in-app selfie + ID). Empty key = off (drivers approved on RC + insurance alone).
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      DIDIT_DRIVER_WORKFLOW_ID: ${DIDIT_DRIVER_WORKFLOW_ID:-}
      DIDIT_RIDER_WORKFLOW_ID: ${DIDIT_RIDER_WORKFLOW_ID:-}
      # Login codes on WhatsApp through WATX (app.watx.in). Empty key = not sent (OTP_DEV_MODE logs them).
      WATX_API_KEY: ${WATX_API_KEY:-}
      # Approved template names; empty = login_otp_passenger / login_otp_driver.
      WATX_OTP_TEMPLATE_PASSENGER: ${WATX_OTP_TEMPLATE_PASSENGER:-}
      WATX_OTP_TEMPLATE_DRIVER: ${WATX_OTP_TEMPLATE_DRIVER:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
    image: tamiltaxi-admin:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side only: the browser never talks to the API directly.
      API_URL: http://api:3000/v1
      # Cookies get the Secure flag in production; set to false only for plain-HTTP deployments.
      COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
    ports:
      - "${ADMIN_PORT:-3001}:3001"

  # HTTPS (Let's Encrypt) for the API and admin: `docker compose --profile https up -d`. Needed for Didit webhooks.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [api, admin]
    environment:
      API_HOST: ${API_HOST:-api.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  adminer:
    image: adminer:5
    profiles: ["tools"]
    depends_on: [postgres]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  redis-insight:
    image: redis/redisinsight:latest
    profiles: ["tools"]
    depends_on: [redis]
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redis-insight-data:/data

volumes:
  uploads:
  postgres-data:
  redis-data:
  redis-insight-data:
  caddy_data:
  caddy_config:
