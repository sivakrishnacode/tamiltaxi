name: tamiltaxi_passenger
description: Tamil Taxi — book rides and send parcels in Coimbatore.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  tamiltaxi_ui:
    path: ../../packages/tamiltaxi_ui
  tamiltaxi_data:
    path: ../../packages/tamiltaxi_data
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true
  assets:
    # Welcome screen picture (P-02), made with ChatGPT; see docs/design/onboarding/.
    - assets/onboarding/
