name: tamiltaxi_driver
description: Tamil Taxi Driver — keep 100% of every fare.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  tamiltaxi_ui:
    path: ../../packages/tamiltaxi_ui
  tamiltaxi_data:
    path: ../../packages/tamiltaxi_data
  tamiltaxi_whatsapp_otp:
    path: ../../packages/tamiltaxi_whatsapp_otp
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  flutter_overlay_window: ^0.5.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_fonts: ^8.2.1
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    # The Tamil Taxi Driver logo (DriverLogo) and the floating bubble over other apps (tt_icon.png); the launcher icon,
    # native splashes and the bubble are made from the logo by scripts/brand_icons.py.
    - assets/brand/
    # Welcome screen picture (D-02), made with ChatGPT; see docs/design/onboarding/.
    - assets/onboarding/

# Patched copy of flutter_overlay_window (see packages/flutter_overlay_window/TT_PATCHES.md).
dependency_overrides:
  flutter_overlay_window:
    path: ../../packages/flutter_overlay_window
